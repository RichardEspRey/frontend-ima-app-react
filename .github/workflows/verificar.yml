name: Verificar

on:
  push:
    branches: [main, Emiliano, Richard]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: El secreto tiene que existir
        env:
          VITE_API_HOST: ${{ secrets.VITE_API_HOST }}
        run: |
          if [ -z "$VITE_API_HOST" ]; then
            echo "::error::Falta el secreto VITE_API_HOST."
            echo "::error::Sin él la app compila, pero apuntando a un host vacío: las llamadas a la API saldrían como undefined/api/... y fallarían en silencio."
            echo "::error::Créalo en Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "VITE_API_HOST presente (${#VITE_API_HOST} caracteres)."

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Sin este secreto la app compila, pero apuntando a un host vacío: todas
      # las llamadas a la API fallarían en silencio. Hay que crearlo en
      # Settings → Secrets and variables → Actions.
      - name: Compilar
        run: npm run build
        env:
          VITE_API_HOST: ${{ secrets.VITE_API_HOST }}

      - name: Pruebas
        run: npm test

      - name: Lint
        run: npm run lint
