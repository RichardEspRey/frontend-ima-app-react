name: Verificar

on:
  push:
    branches: [main, Emiliano, Richard]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Sin este secreto la app compila, pero apuntando a un host vacío: todas
      # las llamadas a la API fallarían en silencio. Hay que crearlo en
      # Settings → Secrets and variables → Actions.
      - name: Compilar
        run: npm run build
        env:
          VITE_API_HOST: ${{ secrets.VITE_API_HOST }}

      - name: Pruebas
        run: npm test

      - name: Lint
        run: npm run lint
